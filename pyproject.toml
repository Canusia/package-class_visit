[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myce_class_visit"
version = "0.0.17"
description = "MyCE - Class Visit"
requires-python = ">=3.8"
# Dependencies live here, not in setup.cfg: with a [project] table that does
# not list them (or mark them dynamic), setuptools ignores install_requires.
# myce_cis>=0.1.5a: templates load the `brand` tag library (package-cis #61);
# an older cis is a TemplateSyntaxError at render time.
dependencies = [
    "Django>=3.2",
    "myce_cis>=0.1.5a",
]
